[project]
name = "bromax-tool"
version = "1.0.0"
description = "Read-only Deriv Digit MATCH market-data research dashboard"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27",
  "websockets>=12,<16",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "pydantic>=2.6"
]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
[tool.pytest.ini_options]
testpaths = ["tests"]
